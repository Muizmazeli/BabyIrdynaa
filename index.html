<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peony Bouquet – 360° View</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fdf1ec;--bg2:#efcdc9;--ink:#6b3a45;--soft:#9a6b74;--btn:#fff8f5;--line:#e3b8bb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a2229;--bg2:#1f1216;--ink:#f6dfe0;--soft:#d3a5ad;--btn:#3a2229;--line:#7a4b57}}
:root[data-theme="dark"]{--bg1:#3a2229;--bg2:#1f1216;--ink:#f6dfe0;--soft:#d3a5ad;--btn:#3a2229;--line:#7a4b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 38%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Jost',system-ui,sans-serif;overflow:hidden;position:relative}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:0;right:0;text-align:center;pointer-events:none;z-index:2}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--soft);font-size:14px}
#stage{position:absolute;inset:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
nav{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:2;flex-wrap:wrap;padding:0 12px}
button{font:500 14px 'Jost',sans-serif;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:100%;text-align:center;font-size:13px;color:var(--soft);pointer-events:none}
#wish{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:rgba(60,22,36,.5);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
#wish[hidden]{display:none}
#wish.on{opacity:1}
.card{--card:#fff7ee;position:relative;width:min(880px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,36px);align-items:center;padding:clamp(18px,3vw,34px);background:var(--card);border:2px solid #e8aab9;border-radius:6px;box-shadow:0 24px 60px rgba(60,20,35,.4);transform:scale(.55) translateY(40px) rotate(-3deg);transition:transform .45s cubic-bezier(.2,1.25,.4,1)}
#wish.on .card{transform:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{--card:#3a2229}}
:root[data-theme="dark"] .card{--card:#3a2229}
.pic{margin:0;padding:8px;background:var(--card);box-shadow:0 6px 18px rgba(60,20,35,.3);transform:rotate(-1.5deg)}
.pic img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover}
.msg{text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;color:var(--ink)}
.msg .to{font-size:clamp(30px,4.5vw,46px);margin:0 0 12px;color:#c0457a}
.msg .txt{font-size:clamp(19px,2.5vw,27px);line-height:1.5;margin:0}
.msg .sig{font-size:clamp(20px,2.6vw,28px);margin:18px 0 0;color:var(--soft)}
.x{position:absolute;top:6px;right:8px;width:40px;height:40px;padding:0;font-size:26px;line-height:1;border-radius:50%}
@media (max-width:640px){.card{grid-template-columns:1fr}.pic img{max-height:42vh}}
@media (prefers-reduced-motion:reduce){.card,#wish{transition:none}}
</style>
</head>
<body>
<header><h1>For My Baby Irdyna ♥</h1></header>
<div id="stage"></div>
<div id="wish" hidden role="dialog" aria-modal="true" aria-label="Wishing card">
<div class="card">
<button class="x" id="wx" aria-label="Close card">&times;</button>
<figure class="pic"><img id="wimg" alt="Our photo together"></figure>
<div class="msg"><p class="to">For you</p><p class="txt">These flowers are just a small reminder that you deserve beautiful things, happy moments, and all the love in the world. 💕</p><p class="sig">with love</p></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var stage=document.getElementById('stage');
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(33,1,0.1,60);
scene.add(new THREE.HemisphereLight(0xfff6f2,0xd9a3ad,0.62));
var key=new THREE.DirectionalLight(0xffffff,0.45);key.position.set(3,6,5);scene.add(key);
var fill=new THREE.DirectionalLight(0xffd9de,0.1);fill.position.set(-5,1,2);scene.add(fill);
var rimL=new THREE.DirectionalLight(0xfff0e8,0.2);rimL.position.set(-2,3,-6);scene.add(rimL);var frontL=new THREE.DirectionalLight(0xfff2ee,0.15);frontL.position.set(0,-2,7);scene.add(frontL);
var rot=new THREE.Group(),bouquet=new THREE.Group();scene.add(rot);rot.add(bouquet);bouquet.position.y=0.15;

var V=THREE.Vector3,M=THREE.Matrix4;
function rnd(a,b){return a+Math.random()*(b-a);}
function rgb(h){var c=new THREE.Color(h);return [c.r,c.g,c.b];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function paint(g,c){var n=g.attributes.position.count,a=[];for(var i=0;i<n;i++)a.push(c[0],c[1],c[2]);g.setAttribute('color',new THREE.Float32BufferAttribute(a,3));return g;}
function merge(list){
  var P=[],N=[],C=[],I=[],off=0;
  list.forEach(function(g){
    var p=g.attributes.position.array,n=g.attributes.normal.array,c=g.attributes.color.array,x=g.index.array,i;
    for(i=0;i<p.length;i++){P.push(p[i]);N.push(n[i]);C.push(c[i]);}
    for(i=0;i<x.length;i++)I.push(x[i]+off);
    off+=p.length/3;
  });
  var m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  m.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  m.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  m.setIndex(I);return m;
}
function surf(nu,nv,fn,cf){
  var P=[],C=[],I=[],i,j,p,c,g=new THREE.BufferGeometry();
  for(j=0;j<=nv;j++)for(i=0;i<=nu;i++){p=fn(i/nu,j/nv);c=cf(i/nu,j/nv);P.push(p[0],p[1],p[2]);C.push(c[0],c[1],c[2]);}
  for(j=0;j<nv;j++)for(i=0;i<nu;i++){var a=j*(nu+1)+i,b=a+1,d=a+nu+1,e=d+1;I.push(a,b,d,b,e,d);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I);g.computeVertexNormals();return g;
}
function vmat(r,extra){var o={vertexColors:true,roughness:r,metalness:0,side:THREE.DoubleSide};for(var k in extra)o[k]=extra[k];return new THREE.MeshStandardMaterial(o);}
function dir(phi,az){return new V(Math.sin(phi)*Math.cos(az),Math.cos(phi),Math.sin(phi)*Math.sin(az));}

// ---- peony ----
var flowerMat=vmat(0.9);
function petal(cup,bend,ruf,c,ph){
  return surf(12,12,function(u,v){
    var x=u*2-1,p=Math.pow(Math.sin(Math.PI*(0.1+0.8*v)),0.45)*(0.3+0.7*Math.min(1,v/0.4));
    return [x*0.72*p,v,-cup*x*x*p+bend*v*v+ruf*Math.sin(x*3.5+ph)*v*v*v];
  },function(u,v){var f=0.8+0.22*Math.pow(v,1.2)+0.05*Math.abs(u*2-1);return [c[0]*f,c[1]*f,c[2]*f];});
}
function flower(c1,c2,L,open){
  var list=[],m=new M(),a=new M(),b=new M(),s=new M();
  for(var i=0;i<L;i++){
    var t=i/(L-1),n=3+Math.round(t*6),c=mix(c1,c2,Math.pow(t,0.8));
    for(var k=0;k<n;k++){
      var sz=(0.45+0.55*Math.pow(t,0.9))*rnd(0.92,1.08);
      var th=(0.08+1.2*Math.pow(t,1.15))*open+rnd(-0.06,0.06);
      m.makeRotationY(k/n*6.283+i*2.4+rnd(-0.2,0.2));
      a.makeTranslation(0,0.2*Math.pow(1-t,1.5),0.03+0.14*t);
      b.makeRotationX(th);s.makeScale(sz*1.05,sz,sz);
      m.multiply(a).multiply(b).multiply(s);
      var j=rnd(0.94,1.06);
      list.push(petal(0.34-0.14*t,0.05+0.35*t*open,0.03+0.03*t,[c[0]*j,c[1]*j,c[2]*j],rnd(0,6)).applyMatrix4(m));
    }
  }
  return new THREE.Mesh(merge(list),flowerMat);
}

// ---- dome of flowers ----
var C0=new V(0,-0.1,0),R=1.3,N=19,MAXP=1.25;
var base=new THREE.Mesh(new THREE.SphereGeometry(R*0.94,28,14,0,6.283,0,1.7),new THREE.MeshStandardMaterial({color:0x86a889,roughness:.9,side:THREE.DoubleSide}));
base.position.copy(C0);bouquet.add(base);
var pinks=[['#e2548f','#f8b4cf'],['#e8689c','#fac1d6'],['#dc4a86','#f5a6c6'],['#ec7aa8','#fbcde0']];
for(var i=0;i<N;i++){
  var phi=Math.acos(1-(1-Math.cos(MAXP))*(i+0.5)/N),az=i*2.39996+0.4,n=dir(phi,az);
  var cream=(i%5===2),bud=(phi>1.0&&i%2===0&&!cream),p=pinks[i%pinks.length];
  var c1=cream?rgb('#f2d4cf'):rgb(p[0]),c2=cream?rgb('#fffaf3'):rgb(p[1]);
  var f=flower(c1,c2,bud?6:8,bud?0.5:rnd(0.9,1.05));
  f.position.copy(C0).addScaledVector(n,R);
  f.quaternion.setFromUnitVectors(new V(0,1,0),n);f.rotateY(rnd(0,6.28));
  f.scale.setScalar((0.64-0.08*phi/MAXP)*(bud?0.85:1)*rnd(0.96,1.04));
  bouquet.add(f);
}

// ---- leaves ----
var dk=rgb('#6f9c76'),lt=rgb('#b2d2b0');
function leaf(len,wid){
  return surf(6,10,function(u,v){
    var x=u*2-1,pr=Math.pow(Math.sin(Math.PI*Math.pow(v,0.8)),0.8);
    return [x*wid*pr,v*len,-0.12*Math.abs(x)*pr*len-0.22*v*v*len];
  },function(u,v){var c=mix(dk,lt,v*0.8);return c;});
}
var ll=[],up=new V(0,1,0);
for(i=0;i<17;i++){
  var ph2=rnd(0.85,1.05),az2=i/17*6.283+rnd(-0.12,0.12),n2=dir(ph2,az2);
  var T=new V(Math.cos(ph2)*Math.cos(az2),-Math.sin(ph2),Math.cos(ph2)*Math.sin(az2));
  var d=n2.clone().addScaledVector(T,-0.1).normalize();
  var zz=up.clone().addScaledVector(d,-d.dot(up)).normalize(),xx=new V().crossVectors(d,zz);
  var lm=new M().makeBasis(xx,d,zz);lm.setPosition(C0.clone().addScaledVector(n2,R*0.8));
  ll.push(leaf(rnd(0.9,1.2),rnd(0.26,0.36)).applyMatrix4(lm));
}
bouquet.add(new THREE.Mesh(merge(ll),vmat(0.7)));

// ---- baby's breath ----
var wl=[],gl=[],gc=rgb('#6f9a72');
for(i=0;i<26;i++){
  var ph3=Math.acos(1-(1-Math.cos(1.35))*(i+0.5)/26),az3=i*2.39996+1,n3=dir(ph3,az3);
  var bs=C0.clone().addScaledVector(n3,R+0.15),Ls=rnd(0.35,0.6),tip=bs.clone().addScaledVector(n3,Ls);
  var st=new THREE.CylinderGeometry(0.012,0.012,Ls,4,1);
  st.applyMatrix4(new M().compose(bs.clone().addScaledVector(n3,Ls/2),new THREE.Quaternion().setFromUnitVectors(up,n3),new V(1,1,1)));
  gl.push(paint(st,gc));
  for(var k=0;k<7;k++){var sp=new THREE.SphereGeometry(rnd(0.022,0.036),6,5);sp.translate(tip.x+rnd(-0.12,0.12),tip.y+rnd(-0.12,0.12),tip.z+rnd(-0.12,0.12));wl.push(paint(sp,[0.95,0.88,0.88]));}
}
bouquet.add(new THREE.Mesh(merge(gl),vmat(0.8)));bouquet.add(new THREE.Mesh(merge(wl),vmat(1)));

// ---- wrapping paper ----
var papers=['#f2c5b8','#f7d6cc','#eab8aa','#f9e0d6'].map(rgb),sl=[];
function sheet(a0,span,rtop,col,ph){
  return surf(22,10,function(u,v){
    var a=a0+span*u,h=v;
    var r=0.15+(rtop-0.15)*h+0.07*Math.sin(a*8+ph)*h+0.12*Math.sin(a*14+ph)*h*h*h;
    var y=-2.1+2.45*h+0.6*Math.pow(Math.max(0,-Math.cos(a)),2)*h*h+0.05*Math.sin(a*11+ph)*Math.pow(h,4);
    return [r*Math.sin(a),y,r*Math.cos(a)];
  },function(u,v){var f=0.86+0.14*v;return [col[0]*f,col[1]*f,col[2]*f];});
}
for(i=0;i<7;i++)sl.push(sheet(i*0.9,2.3,rnd(1.85,2.1),papers[i%4],rnd(0,6)));
bouquet.add(new THREE.Mesh(merge(sl),vmat(0.88,{emissive:0x5a3a30,emissiveIntensity:0.55})));
var tul=surf(64,10,function(u,v){var a=u*6.283;var r=0.4+1.6*v+0.12*Math.sin(a*10)*v*v;return [r*Math.sin(a),-1.2+1.6*v+0.05*Math.sin(a*10+1)*v*v,r*Math.cos(a)];},function(){return [0.96,0.82,0.85];});
bouquet.add(new THREE.Mesh(tul,vmat(1,{transparent:true,opacity:0.25,depthWrite:false})));

// ---- ribbon, lace, bow ----
var rm=new THREE.MeshStandardMaterial({color:0xeab0bb,roughness:0.5,side:THREE.DoubleSide});
var lcm=new THREE.MeshStandardMaterial({color:0xfffaf5,roughness:1});
function put(o,x,y,z){o.position.set(x,y,z);bouquet.add(o);return o;}
put(new THREE.Mesh(new THREE.TorusGeometry(0.95,0.045,8,64),rm),0,-1.1,0).rotation.x=Math.PI/2;
var lace=put(new THREE.Mesh(new THREE.TorusGeometry(0.99,0.07,6,64),lcm),0,-1.02,0);lace.rotation.x=Math.PI/2;lace.scale.z=0.5;
put(new THREE.Mesh(new THREE.SphereGeometry(0.1,12,8),rm),0,-1.08,1.0).scale.set(1,1.1,0.8);
[-1,1].forEach(function(s){
  var lp=put(new THREE.Mesh(new THREE.TorusGeometry(0.26,0.07,8,28),rm),s*0.3,-1.08,1.0);lp.scale.set(1.3,0.8,0.5);lp.rotation.z=s*0.3;
  var tl=new THREE.PlaneGeometry(0.15,1.0,1,12),pp=tl.attributes.position;
  for(var q=0;q<pp.count;q++){var y=pp.getY(q);pp.setX(q,pp.getX(q)+s*(0.55-y)*0.12);pp.setZ(q,Math.sin((0.55-y)*2)*0.06);}
  tl.computeVertexNormals();
  put(new THREE.Mesh(tl,rm),s*0.08,-1.55,0.72).rotation.x=0.62;
});

// ---- photo holder + note holder ----
function pick(az,phi,build){
  var n=dir(phi,az),P=C0.clone().addScaledVector(n,R+0.8),B=C0.clone().addScaledVector(n,R*0.8);
  var bot=P.clone();bot.y-=0.38;var dv=bot.clone().sub(B),len=dv.length();
  var st=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,len,6),new THREE.MeshStandardMaterial({color:0xb98d5e,roughness:0.7}));
  st.position.copy(B).addScaledVector(dv,0.5);st.quaternion.setFromUnitVectors(up,dv.normalize());bouquet.add(st);
  var g=new THREE.Group();g.position.copy(P);g.rotation.y=Math.PI/2-az;build(g);bouquet.add(g);
}
pick(1.95,0.5,function(g){

function openWish(){wimg.src=WIMG;wasAuto=auto;setAuto(false);wish.hidden=false;void wish.offsetWidth;wish.classList.add('on');document.getElementById('wx').focus();}
function closeWish(){wish.classList.remove('on');setTimeout(function(){wish.hidden=true;},260);if(wasAuto)setAuto(true);}
document.getElementById('wx').onclick=closeWish;
wish.addEventListener('click',function(e){if(e.target===wish)closeWish();});
addEventListener('keydown',function(e){if(e.key==='Escape'&&!wish.hidden)closeWish();});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;pts[e.pointerId]=e;drag=Object.keys(pts).length===1;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);target=null;});
el.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId]){el.style.cursor=hitNote(e)?'pointer':'';return;}pts[e.pointerId]=e;
  var ids=Object.keys(pts);
  if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=clamp(dist*pinch/d,5,14);pinch=d;return;}
  vel=(e.clientX-lx)*0.008;yaw+=vel;pitch=clamp(pitch+(e.clientY-ly)*0.005,-0.5,1.3);lx=e.clientX;ly=e.clientY;
});
function up2(e){var one=Object.keys(pts).length===1;delete pts[e.pointerId];pinch=0;drag=false;if(one&&e.type==='pointerup'&&Math.hypot(e.clientX-sx,e.clientY-sy)<6&&hitNote(e))openWish();}
el.addEventListener('pointerup',up2);el.addEventListener('pointercancel',up2);
el.addEventListener('wheel',function(e){e.preventDefault();dist=clamp(dist+e.deltaY*0.005,5,14);},{passive:false});
function setAuto(v){auto=v;}
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();fit=Math.max(1,0.8/camera.aspect);}
addEventListener('resize',resize);resize();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)setAuto(false);
function loop(){
  requestAnimationFrame(loop);
  if(target){yaw+=(target.y-yaw)*0.08;pitch+=(target.p-pitch)*0.08;if(Math.abs(target.y-yaw)<0.003&&Math.abs(target.p-pitch)<0.003)target=null;}
  else if(!drag){if(auto)yaw+=0.005;else{yaw+=vel;vel*=0.94;}}
  rot.rotation.y=yaw;rot.rotation.x=pitch;
  camera.position.set(0,0.3,dist*fit);camera.lookAt(0,0.4,0);
  renderer.render(scene,camera);
}
loop();
})();
</script>
